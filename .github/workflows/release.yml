name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release
        required: true

permissions:
  contents: write

env:
  ZIG_VERSION: 0.16.0

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Resolve version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          case "$TAG" in
            *[!A-Za-z0-9._-]*|'')
              echo "refusing to release from tag '$TAG'" >&2
              exit 1
              ;;
          esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Test
        run: zig build test

      - name: Build
        run: zig build release -Dversion-string="$VERSION" --summary all

      - name: Archive
        run: |
          dist="$PWD/dist"
          mkdir -p "$dist"

          for dir in zig-out/release/*/; do
            target="$(basename "$dir")"
            staging="staging/$target"
            mkdir -p "$staging"
            cp LICENSE README.md "$staging/"

            if [ -f "$dir/whats.exe" ]; then
              cp "$dir/whats.exe" "$staging/"
              (cd "$staging" && zip -q -X "$dist/whats_$target.zip" LICENSE README.md whats.exe)
            else
              cp "$dir/whats" "$staging/"
              tar -czf "$dist/whats_$target.tar.gz" -C "$staging" LICENSE README.md whats
            fi
          done

          cd "$dist"
          sha256sum whats_* > whats_checksums.txt
          ls -l

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              dist/*
          fi
